<!doctype html>
<!-- Loudness check for the Draw & Animate flipbook tunes. Serve the repo root (python3 -m http.server 8124) and open
     http://localhost:8124/tools/check-tunes.html . For each tune it renders 16 seconds offline and shows the loudness
     (RMS, dB), the peak (must stay under 1) and how much of the sound is above 200 Hz (what a phone speaker plays).
     Aim: RMS between about -24 and -17 dB, so the tunes are as loud as each other. -->
<meta charset="utf-8" />
<title>Flipbook tunes check</title>
<pre id="out">Rendering…</pre>
<script type="module">
  import { TUNES, renderTune } from "../public/games/draw-animate/music.js";
  const secs = 16, SR = 44100, rows = [];
  for (const t of TUNES) {
    const ctx = new OfflineAudioContext(1, SR * secs, SR);
    let err = "";
    try { renderTune(t.id, ctx, secs); } catch (e) { err = String(e); }
    const d = (await ctx.startRendering()).getChannelData(0), a = 1 / (1 + (2 * Math.PI * 200) / SR);
    let sum = 0, hi = 0, peak = 0, y = 0, prev = 0, bad = 0;
    for (let i = SR; i < d.length; i += 1) { const x = d[i]; if (!Number.isFinite(x)) { bad += 1; continue; } y = a * (y + x - prev); prev = x; sum += x * x; hi += y * y; peak = Math.max(peak, Math.abs(x)); }
    rows.push({ id: t.id, rms: +(10 * Math.log10(sum / (d.length - SR) + 1e-12)).toFixed(1), peak: +peak.toFixed(2), phone: Math.round((hi / (sum + 1e-12)) * 100), bad, err });
  }
  window.RESULT = rows;
  document.getElementById("out").textContent = "tune         RMS dB  peak  phone%\n" + rows.map((r) => `${r.id.padEnd(12)} ${String(r.rms).padStart(6)}  ${String(r.peak).padStart(4)}  ${String(r.phone).padStart(5)} ${r.bad ? " BAD SAMPLES " + r.bad : ""}${r.err ? " ERROR " + r.err : ""}`).join("\n");
</script>
