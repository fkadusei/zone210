<!doctype html>
<!-- Measures the page-turn sound (public/assets/paper.js) by rendering it without playing it, beside the two older
     sounds it replaced, so the loudness can be compared. Serve the repo root (python3 -m http.server 8124) and open
     http://localhost:8124/tools/check-paper.html : the numbers appear on the page and in window.result. -->
<meta charset="utf-8" /><title>Page-turn sound</title><body style="font:14px ui-monospace,monospace;white-space:pre;padding:16px">measuring…
<script type="module">
  import { pageTurn, pageLift } from "../public/assets/paper.js";
  const SR = 44100;
  async function measure(len, make) {
    const ac = new OfflineAudioContext(1, Math.floor(SR * len), SR); make(ac);
    const d = (await ac.startRendering()).getChannelData(0);
    let peak = 0, sum = 0, zc = 0, last = 0, end = 0;
    for (let i = 0; i < d.length; i += 1) { const v = d[i]; peak = Math.max(peak, Math.abs(v)); sum += v * v; if ((v >= 0) !== (last >= 0)) zc += 1; last = v; if (Math.abs(v) > 0.004) end = i; }
    // how the loudness moves through the sound, in ten slices: a turn should rise, hold, then end with a knock
    const slices = Array.from({ length: 10 }, (_, k) => { let s = 0; const a = Math.floor((end * k) / 10), b = Math.floor((end * (k + 1)) / 10); for (let i = a; i < b; i += 1) s += d[i] * d[i]; return Math.round(Math.sqrt(s / Math.max(1, b - a)) * 1000) / 1000; });
    return { peak: Math.round(peak * 1000) / 1000, rms: Math.round(Math.sqrt(sum / Math.max(1, end)) * 1000) / 1000, seconds: Math.round((end / SR) * 100) / 100, brightnessHz: Math.round((zc / 2 / (end / SR))), slices };
  }
  // the two older sounds, as they were
  const oldBook = (c) => { const buf = c.createBuffer(1, SR * 2, SR), d = buf.getChannelData(0); let low = 0; for (let i = 0; i < d.length; i += 1) { const w = Math.random() * 2 - 1; low = (low + 0.06 * w) / 1.06; d[i] = w * 0.55 + low * 3.2; }
    const burst = (t, { dur, vol, f0, f1, f2, q = 1 }) => { const s = c.createBufferSource(); s.buffer = buf; const f = c.createBiquadFilter(); f.type = "bandpass"; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.45); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur); const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f); f.connect(g); g.connect(c.destination); s.start(t, 0.3); s.stop(t + dur + 0.05); };
    burst(0.01, { dur: 0.34, vol: 0.5, f0: 900, f1: 2800, f2: 1100, q: 0.8 }); burst(0.06, { dur: 0.22, vol: 0.16, f0: 3500, f1: 6000, q: 0.6 }); burst(0.31, { dur: 0.045, vol: 0.3, f0: 3400, f1: 5200, q: 0.7 });
    const o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(180, 0.31); o.frequency.exponentialRampToValueAtTime(90, 0.4); g.gain.setValueAtTime(0.0001, 0.31); g.gain.exponentialRampToValueAtTime(0.2, 0.322); g.gain.exponentialRampToValueAtTime(0.0001, 0.4); o.connect(g); g.connect(c.destination); o.start(0.31); o.stop(0.45); };
  const oldFlick = (c) => { const buf = c.createBuffer(1, Math.floor(SR * 0.25), SR), d = buf.getChannelData(0); for (let i = 0; i < d.length; i += 1) d[i] = Math.random() * 2 - 1; const t = 0, len = 0.16, s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain(); s.buffer = buf; bp.type = "bandpass"; bp.Q.value = 0.8; bp.frequency.setValueAtTime(2600, t); bp.frequency.exponentialRampToValueAtTime(900, t + len); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + len); s.connect(bp).connect(g).connect(c.destination); s.start(t); s.stop(t + len + 0.02); };
  const result = {
    "new: Playbook page (0.8 s)": await measure(1.4, (c) => pageTurn(c, { dur: 0.8, at: 0 })),
    "new: flipbook page (0.32 s)": await measure(0.8, (c) => pageTurn(c, { dur: 0.32, at: 0 })),
    "new: quick riffle (0.1 s)": await measure(0.4, (c) => pageTurn(c, { dur: 0.1, at: 0 })),
    "new: lift": await measure(0.3, (c) => pageLift(c, { at: 0 })),
    "old: Playbook page": await measure(1.0, oldBook),
    "old: flipbook page": await measure(0.5, oldFlick),
  };
  window.result = result;
  document.body.textContent = Object.entries(result).map(([k, v]) => `${k.padEnd(30)} peak ${v.peak}  rms ${v.rms}  ${v.seconds}s  ~${v.brightnessHz} Hz\n${" ".repeat(30)} ${v.slices.join(" ")}`).join("\n");
</script></body>
