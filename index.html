<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Game Room</title>
    <meta name="description" content="Free games and activities for kids and adults. Play in your browser: no installs, no sign-ups." />
    <meta name="theme-color" content="#1d130e" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="assets/shell.css" />
    <link rel="stylesheet" href="assets/portal.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <div class="brand">
          <span class="kente" aria-hidden="true"></span>
          <span class="brand-name">Game Room</span>
        </div>
        <h1>Play something fun.</h1>
        <p class="lead">Board games, brain teasers and activities for kids and grown-ups. Free, right in your browser: no installs, no sign-ups.</p>

        <div class="controls">
          <div class="tabs" role="tablist" aria-label="Who is playing?">
            <button class="tab" role="tab" data-audience="all" aria-selected="true">Everyone</button>
            <button class="tab" role="tab" data-audience="kids" aria-selected="false">🧒 For kids</button>
            <button class="tab" role="tab" data-audience="adults" aria-selected="false">🧑 For adults</button>
          </div>
          <div class="search-row">
            <input id="search" type="search" placeholder="Search games…" aria-label="Search games" autocomplete="off" />
            <button id="surprise" class="g-btn">🎁 Surprise me</button>
          </div>
          <div class="tag-row" id="tags" aria-label="Filter by type"></div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <p class="count" id="count" aria-live="polite"></p>
      <ul class="grid" id="grid"></ul>
      <p class="empty" id="empty" hidden>No games match. Try a different filter.</p>
    </main>

    <footer class="foot">
      <p>Made with care. Your scores and saved games stay on your own device.</p>
    </footer>

    <script type="module" src="assets/portal.js"></script>
  </body>
</html>
