<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zone 210</title>
    <meta name="description" content="Free games and activities for kids and adults. Play in your browser: no installs, no sign-ups." />
    <meta name="theme-color" content="#0f1013" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="assets/shell.css" />
    <link rel="stylesheet" href="assets/portal.css" />
  </head>
  <body>
    <header class="top">
      <span class="wordmark">Zone 210</span>
    </header>

    <main class="wrap">
      <section class="intro">
        <h1>Play something fun.</h1>
        <p>Free games and activities for kids and grown-ups. No installs, no sign-ups.</p>
      </section>

      <div class="bar">
        <div class="tabs" role="tablist" aria-label="Who is playing?">
          <button class="tab" role="tab" data-audience="all" aria-selected="true">Everyone</button>
          <button class="tab" role="tab" data-audience="kids" aria-selected="false">Kids</button>
          <button class="tab" role="tab" data-audience="adults" aria-selected="false">Adults</button>
        </div>
        <div class="tools">
          <input id="search" type="search" placeholder="Search" aria-label="Search games" autocomplete="off" />
          <button id="surprise" class="link-btn" title="Open a random game">Surprise me</button>
        </div>
      </div>

      <ul class="grid" id="grid"></ul>
      <p class="empty" id="empty" hidden>No games match. Try a different search.</p>
    </main>

    <footer class="foot">
      <p>Your scores and saved games stay on your own device.</p>
    </footer>

    <script type="module" src="assets/portal.js"></script>
  </body>
</html>
