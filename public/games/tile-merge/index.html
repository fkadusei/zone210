<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tile Merge · Zone 210</title>
    <meta name="theme-color" content="#eef0f5" />
    <script src="../../assets/theme.js"></script>
    <script src="../../assets/saver.js"></script>
    <link rel="stylesheet" href="../../assets/shell.css" />
    <link rel="stylesheet" href="style.css" />
      <meta name="description" content="Slide and merge matching numbers to reach 2048. Swipe on a phone, arrow keys on a computer." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zone 210" />
    <meta property="og:title" content="Tile Merge · Zone 210" />
    <meta property="og:description" content="Slide and merge matching numbers to reach 2048. Swipe on a phone, arrow keys on a computer." />
    <meta property="og:url" content="https://zone210.com/games/tile-merge/" />
    <meta property="og:image" content="https://zone210.com/assets/og/tile-merge.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tile Merge on Zone 210" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tile Merge · Zone 210" />
    <meta name="twitter:description" content="Slide and merge matching numbers to reach 2048. Swipe on a phone, arrow keys on a computer." />
    <meta name="twitter:image" content="https://zone210.com/assets/og/tile-merge.jpg" />
  </head>
  <body>
    <main class="g-page narrow">
      <div class="g-head">
        <div>
          <h1>Tile Merge</h1>
          <p>Slide the tiles. When two equal numbers touch, they merge. Can you reach 2048?</p>
        </div>
        <div class="g-bar">
          <button class="g-btn ghost" id="undo">Undo</button>
          <button class="g-btn" id="restart">New Game</button>
        </div>
      </div>

      <div class="g-stats">
        <div class="g-stat"><b id="score">0</b><span>Score</span></div>
        <div class="g-stat"><b id="best">0</b><span>Best</span></div>
        <div class="g-stat"><b id="top">2</b><span>Top tile</span></div>
      </div>

      <div class="board" id="board" tabindex="0" aria-label="Game board. Use arrow keys or swipe to move tiles.">
        <div class="cells" aria-hidden="true"></div>
        <div class="tiles" id="tiles"></div>
      </div>
      <p class="hint">Arrow keys or WASD on a keyboard · swipe on a phone</p>
    </main>

    <div class="g-overlay" id="end" role="dialog" aria-modal="true" aria-labelledby="endTitle">
      <div class="card">
        <div class="big" id="endEmoji" aria-hidden="true">🎉</div>
        <h2 id="endTitle">You reached 2048!</h2>
        <p id="endText"></p>
        <div class="g-bar" style="justify-content:center">
          <button class="g-btn ghost" id="keepGoing">Keep going</button>
          <button class="g-btn" id="again">New game</button>
        </div>
      </div>
    </div>

    <script src="../../assets/back-link.js"></script>
    <script type="module" src="game.js"></script>
  </body>
</html>
