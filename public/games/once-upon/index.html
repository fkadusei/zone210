<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" content="#0a0e1a" />
    <script src="../../assets/theme.js"></script>
    <script src="../../assets/saver.js"></script>
    <link rel="stylesheet" href="../../assets/shell.css" />
    <link rel="stylesheet" href="style.css" />
    <meta name="description" content="Eighteen classic tales from around the world as living picture books: Cinderella, the Three Little Pigs, Momotaro, Ali Baba and more. Make choices, help with little activities, find every ending, and listen along." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zone 210" />
    <meta property="og:title" content="Once Upon a Time · Zone 210" />
    <meta property="og:description" content="Eighteen classic tales from around the world as living picture books: Cinderella, the Three Little Pigs, Momotaro, Ali Baba and more. Make choices, help with little activities, find every ending, and listen along." />
    <meta property="og:url" content="https://zone210.com/games/once-upon/" />
    <meta property="og:image" content="https://zone210.com/assets/og/once-upon.jpg" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Once Upon a Time · Zone 210" />

  </head>
  <body>
    <main class="g-page">
      <div class="g-head">
        <div>
          <h1>Once Upon a Time</h1>
          <p>Classic tales from around the world. You help tell the story.</p>
        </div>
        <div class="g-bar">
          <button class="g-btn ghost" id="speak" aria-pressed="false">🔊 Read to me</button>
          <button class="g-btn ghost" id="size" aria-label="Change the text size">A</button>
        </div>
      </div>
      <section class="voicebar" id="voicebar" aria-label="Reading voice">
        <label>Narrator <select id="narrator"></select></label>
        <select id="devvoice" hidden aria-label="Your device's voice"></select>
      </section>
      <section id="library"></section>
      <section id="reader" hidden>
        <div class="bar">
          <button class="g-btn ghost" id="toLib">← Stories</button>
          <b id="rTitle"></b>
          <span class="pg" id="rPage"></span>
        </div>
        <div id="art"></div>
        <div class="book" id="book" aria-live="polite">
          <div id="text"></div>
          <p class="vdef" id="vdef" hidden></p>
          <p class="hint" id="hint" hidden role="alert"></p>
          <div class="choices" id="choices"></div>
          <div class="endcard" id="endcard" hidden></div>
        </div>
        <div class="row">
          <button class="g-btn ghost" id="back">↶ Go back</button>
          <button class="g-btn ghost" id="again">↻ Start again</button>
          <button class="g-btn ghost" id="say">🔊 Read this page</button>
        </div>
      </section>
    </main>
    <script src="../../assets/sound.js"></script>
    <script src="../../assets/back-link.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
