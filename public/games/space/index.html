<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Space Explorer · Zone 210</title>
    <meta name="theme-color" content="#050816" />
    <script src="../../assets/theme.js"></script>
    <script src="../../assets/saver.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="../../assets/shell.css" />
    <link rel="stylesheet" href="style.css" />
      <meta name="description" content="Fly around a 3D solar system. Visit every planet and its moons, weigh yourself on other worlds, switch to true scale, and test what you know." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zone 210" />
    <meta property="og:title" content="Space Explorer · Zone 210" />
    <meta property="og:description" content="Fly around a 3D solar system. Visit every planet and its moons, weigh yourself on other worlds, switch to true scale, and test what you know." />
    <meta property="og:url" content="https://zone210.com/games/space/" />
    <meta property="og:image" content="https://zone210.com/assets/og/space.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Space Explorer on Zone 210" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Space Explorer · Zone 210" />
    <meta name="twitter:description" content="Fly around a 3D solar system. Visit every planet and its moons, weigh yourself on other worlds, switch to true scale, and test what you know." />
    <meta name="twitter:image" content="https://zone210.com/assets/og/space.jpg" />
  </head>
  <body>
    <main class="g-page wide">
      <div class="g-head">
        <div>
          <h1>Space Explorer</h1>
          <p>Fly around the solar system. Tap a planet to meet it and its moons, switch to true scale, or test what you know.</p>
        </div>
        <div class="g-bar">
          <button class="g-btn ghost" id="mute" aria-pressed="false">Sound On</button>
        </div>
      </div>

      <div class="g-chips tabs" id="tabs" role="tablist" aria-label="Activities">
        <button class="g-chip" role="tab" data-tab="explore" aria-pressed="true">🚀 Explore</button>
        <button class="g-chip" role="tab" data-tab="scale" aria-pressed="false">📏 Scale lab</button>
        <button class="g-chip" role="tab" data-tab="quiz" aria-pressed="false">❓ Space quiz</button>
      </div>

      <section id="explore">
        <section class="g-panel setup" aria-label="Options">
          <div class="opt"><span class="lbl">Scale</span>
            <div class="g-chips" id="scaleMode" role="group" aria-label="Scale">
              <button class="g-chip" data-value="easy" aria-pressed="true">Easy to see</button>
              <button class="g-chip" data-value="true" aria-pressed="false">True scale</button>
            </div></div>
          <div class="opt"><span class="lbl">Speed</span>
            <div class="g-chips" id="speed" role="group" aria-label="Orbit speed">
              <button class="g-chip" data-value="0" aria-pressed="false">⏸ Paused</button>
              <button class="g-chip" data-value="20" aria-pressed="true">Slow</button>
              <button class="g-chip" data-value="120" aria-pressed="false">Fast</button>
              <button class="g-chip" data-value="600" aria-pressed="false">Super fast</button>
            </div></div>
          <div class="opt"><span class="lbl">Show</span>
            <div class="g-chips" id="show" role="group" aria-label="What to show">
              <button class="g-chip" data-value="orbits" aria-pressed="true">Orbits</button>
              <button class="g-chip" data-value="labels" aria-pressed="true">Names</button>
            </div></div>
          <div class="opt"><span class="lbl">Go to</span>
            <div class="g-chips" id="goto" role="group" aria-label="Go to a planet"></div></div>
        </section>

        <div class="layout">
          <div class="stage-wrap">
            <div class="stage" id="stage" aria-label="Interactive solar system">
              <div class="stage-loading" id="loading">Loading the solar system…</div>
              <div class="labels" id="labels"></div>
              <div class="stage-note" id="note" hidden></div>
              <div class="stage-tools">
                <button class="g-btn ghost sm" id="home">Whole solar system</button>
              </div>
            </div>
            <p class="hintline">Drag to turn, scroll or pinch to zoom, tap a planet or its name.</p>
          </div>
          <aside class="side" aria-label="About this world">
            <section class="g-panel card" id="card" aria-live="polite"></section>
          </aside>
        </div>
      </section>

      <section id="scale" hidden></section>
      <section id="quiz" hidden></section>
    </main>
    <script src="../../assets/sound.js"></script>
    <script src="../../assets/back-link.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
