  <body>
    <main class="g-page">
      <div class="g-head">
        <div>
          <h1>Calm Corner</h1>
          <p>A quiet place to breathe, notice your feelings and relax.</p>

        <div class="g-bar">
          <button class="g-btn ghost" id="voice" aria-pressed="true">🗣️ Voice on</button>

      </div>

        <button class="g-chip" role="tab" data-tab="feel" aria-pressed="false">💭 How do I feel?</button>
        <button class="g-chip" role="tab" data-tab="senses" aria-pressed="false">🖐️ 5-4-3-2-1</button>
        <button class="g-chip" role="tab" data-tab="sounds" aria-pressed="false">🎧 Calm sounds</button>
      </div>
      <section id="view"></section>
      <p class="foot">If you often feel very sad, worried or scared, please talk to a grown-up you trust. You don't have to handle big feelings alone.</p>
