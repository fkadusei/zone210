<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spell Sprout · Zone 210</title>
    <meta name="theme-color" content="#eef0f5" />
    <script src="../../assets/theme.js"></script>
    <script src="../../assets/saver.js"></script>
    <link rel="stylesheet" href="../../assets/shell.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="g-page narrow">
      <div class="g-head">
        <div>
          <h1>Spell Sprout</h1>
          <p>Listen to the word, then spell it to grow your garden.</p>
        </div>
        <div class="g-bar">
          <button class="g-btn ghost" id="mute" aria-pressed="false">Sound On</button>
          <button class="g-btn" id="newGame">New Game</button>
        </div>
      </div>

      <div class="g-bar level">
        <div class="g-chips" id="level" role="group" aria-label="Difficulty">
          <button class="g-chip" data-value="easy" aria-pressed="true">Easy <small>ages 5–7</small></button>
          <button class="g-chip" data-value="medium" aria-pressed="false">Medium <small>ages 7–9</small></button>
          <button class="g-chip" data-value="hard" aria-pressed="false">Hard <small>ages 9+</small></button>
        </div>
      </div>

      <div class="theme-row">
        <span class="lbl">Theme</span>
        <div class="g-chips" id="theme" role="group" aria-label="Word theme"></div>
      </div>

      <div class="g-stats">
        <div class="g-stat"><b id="score">0</b><span>Score</span></div>
        <div class="g-stat"><b id="streak">0</b><span>Streak</span></div>
        <div class="g-stat"><b id="best">0</b><span>Best</span></div>
        <div class="g-stat"><b id="round">1/10</b><span>Word</span></div>
      </div>

      <div class="garden" id="garden" aria-label="Your garden"></div>

      <section class="g-panel card-word" id="card">
        <div class="picture" id="picture" aria-hidden="true">🌱</div>
        <p class="clue" id="clue"></p>
        <div class="hearing">
          <button class="g-btn" id="hear">🔊 Hear word</button>
          <button class="g-btn ghost" id="slow">🐢 Slowly</button>
          <button class="g-btn ghost" id="hint">💡 Hint</button>
        </div>
        <div class="tries" id="tries" aria-label="Tries left"></div>
        <div class="slots" id="slots" aria-label="Your spelling"></div>
        <div class="burst" id="burst" aria-hidden="true"></div>
      </section>

      <section class="bank" id="bank" aria-label="Letters"></section>

      <div class="tools">
        <button class="g-btn ghost" id="back">⌫ Back</button>
        <button class="g-btn" id="check">Check</button>
      </div>
      <p class="g-status" id="msg" role="status" aria-live="polite"></p>
    </main>

    <div class="g-overlay" id="end" role="dialog" aria-modal="true" aria-labelledby="endTitle">
      <div class="card">
        <div class="big" id="endEmoji" aria-hidden="true">🌻</div>
        <h2 id="endTitle">Garden complete!</h2>
        <p id="endText"></p>
        <div class="end-garden" id="endGarden" aria-hidden="true"></div>
        <div class="practice" id="practice" hidden></div>
        <div class="g-bar" style="justify-content:center">
          <button class="g-btn ghost" id="endNext">Next level</button>
          <button class="g-btn" id="endAgain">Play again</button>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
    <script src="../../assets/sound.js"></script>
    <script src="../../assets/back-link.js"></script>
  </body>
</html>
