<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fractions Lab · Zone 210</title>
    <meta name="theme-color" content="#0a0e1a" />
    <script src="../../assets/theme.js"></script>
    <script src="../../assets/saver.js"></script>
    <link rel="stylesheet" href="../../assets/shell.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="g-page narrow">
      <div class="g-head">
        <div>
          <h1>Fractions Lab</h1>
          <p>See fractions, compare them, make them equal, add them up and place them on the number line.</p>
        </div>
        <div class="g-bar">
          <button class="g-btn ghost" id="mute" aria-pressed="false">Sound On</button>
        </div>
      </div>

      <div class="g-chips tabs" id="tabs" role="tablist" aria-label="Activities">
        <button class="g-chip" role="tab" data-tab="explore" aria-pressed="true">🔍 Explore</button>
        <button class="g-chip" role="tab" data-tab="compare" aria-pressed="false">⚖️ Compare</button>
        <button class="g-chip" role="tab" data-tab="equal" aria-pressed="false">🟰 Make equal</button>
        <button class="g-chip" role="tab" data-tab="add" aria-pressed="false">➕ Add &amp; subtract</button>
        <button class="g-chip" role="tab" data-tab="line" aria-pressed="false">📏 Number line</button>
      </div>

      <section id="view" aria-live="polite"></section>
    </main>
    <script src="../../assets/sound.js"></script>
    <script src="../../assets/back-link.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
