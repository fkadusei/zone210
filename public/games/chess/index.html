<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chess · Zone 210</title>
    <meta name="theme-color" content="#eef0f5" />
    <script src="../../assets/theme.js"></script>
    <script src="../../assets/saver.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="../../assets/shell.css" />
    <link rel="stylesheet" href="style.css" />
      <meta name="description" content="Play the computer at three levels, a friend on one device, or a friend online." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zone 210" />
    <meta property="og:title" content="Chess · Zone 210" />
    <meta property="og:description" content="Play the computer at three levels, a friend on one device, or a friend online." />
    <meta property="og:url" content="https://zone210.com/games/chess/" />
    <meta property="og:image" content="https://zone210.com/assets/og/chess.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chess on Zone 210" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chess · Zone 210" />
    <meta name="twitter:description" content="Play the computer at three levels, a friend on one device, or a friend online." />
    <meta name="twitter:image" content="https://zone210.com/assets/og/chess.jpg" />
  </head>
  <body>
    <main class="g-page wide">
      <div class="g-head">
        <div>
          <h1>Chess</h1>
          <p>Play the computer, a friend on this device, or a friend online.</p>
        </div>
        <div class="g-bar">
          <button class="g-btn ghost" id="mute" aria-pressed="false">Sound On</button>
          <button class="g-btn" id="newgame">New Game</button>
        </div>
      </div>

      <div class="layout">
        <div class="stage-col">
          <div class="player-bar" id="topBar"></div>
          <div class="stage" id="stage" aria-label="Chess board">
            <div class="stage-loading" id="stageLoading">Loading the board…</div>
          </div>
          <div class="player-bar" id="bottomBar"></div>
        </div>

        <aside class="side" aria-label="Game information">
      <section class="g-panel setup" aria-label="Game options">
            <div class="opt"><span class="lbl">Mode</span>
              <div class="g-chips" id="mode" role="group" aria-label="Mode">
                <button class="g-chip" data-value="cpu" aria-pressed="true">vs Computer</button>
                <button class="g-chip" data-value="two" aria-pressed="false">2 players</button>
                <button class="g-chip" data-value="online" aria-pressed="false">Online</button>
              </div></div>
            <div class="opt" data-for="cpu"><span class="lbl">Level</span>
              <div class="g-chips" id="level" role="group" aria-label="Difficulty">
                <button class="g-chip" data-value="easy" aria-pressed="false">Easy</button>
                <button class="g-chip" data-value="normal" aria-pressed="true">Normal</button>
                <button class="g-chip" data-value="hard" aria-pressed="false">Hard</button>
              </div></div>
            <div class="opt" data-for="cpu online"><span class="lbl">Play as</span>
              <div class="g-chips" id="side" role="group" aria-label="Your colour">
                <button class="g-chip" data-value="w" aria-pressed="true">White</button>
                <button class="g-chip" data-value="b" aria-pressed="false">Black</button>
                <button class="g-chip" data-value="r" aria-pressed="false">Random</button>
              </div></div>
            <div class="opt" data-for="cpu two online"><span class="lbl">Clock</span>
              <div class="g-chips" id="time" role="group" aria-label="Time control">
                <button class="g-chip" data-value="0" aria-pressed="true">No clock</button>
                <button class="g-chip" data-value="3" aria-pressed="false">3 min</button>
                <button class="g-chip" data-value="5" aria-pressed="false">5 min</button>
                <button class="g-chip" data-value="10" aria-pressed="false">10 min</button>
              </div></div>
            <div class="opt"><span class="lbl">View</span>
              <div class="g-chips" id="view" role="group" aria-label="Board view">
                <button class="g-chip" data-value="3d" aria-pressed="true">3D</button>
                <button class="g-chip" data-value="2d" aria-pressed="false">2D</button>
              </div></div>
          </section>

          <!-- Online lobby -->
          <section class="g-panel online" id="onlinePanel" aria-label="Online play" hidden>
            <div id="lobbyStart" class="lobby-row">
              <button class="g-btn" id="createRoom">Create a room</button>
              <span class="or">or</span>
              <form class="join" id="joinForm">
                <input id="joinCode" maxlength="5" placeholder="ROOM CODE" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room code" />
                <button class="g-btn ghost" type="submit">Join</button>
              </form>
            </div>
            <div id="lobbyWait" class="lobby-wait" hidden>
              <div class="code-box"><span class="lbl">Room code</span><span class="room-code" id="roomCode">-----</span></div>
              <div class="lobby-msg" id="lobbyMsg">Waiting for your friend…</div>
              <div class="g-bar"><button class="g-btn ghost" id="copyLink">Copy invite link</button><button class="g-btn ghost" id="leaveRoom">Cancel</button></div>
            </div>
            <div id="lobbyLive" class="lobby-live" hidden>
              <span class="pill" id="livePill">Online</span>
              <span class="lobby-msg" id="liveMsg"></span>
              <button class="g-btn ghost" id="leaveLive">Leave</button>
            </div>
            <p class="online-error" id="onlineError" role="alert"></p>
          </section>
          <div class="g-panel status-card">
            <div class="status-line" id="statusLine" role="status" aria-live="polite"></div>
            <div class="think" id="think" hidden><span class="spinner" aria-hidden="true"></span> <span id="thinkText">Computer is thinking…</span></div>
            <div class="banner" id="banner" hidden></div>
          </div>
          <div class="g-panel moves-card">
            <div class="lbl">Moves</div>
            <ol class="moves" id="moves" aria-label="Move list"></ol>
          </div>
          <div class="g-bar actions">
            <button class="g-btn ghost" id="undo">Undo</button>
            <button class="g-btn ghost" id="hint">Hint</button>
            <button class="g-btn ghost" id="flip">Flip board</button>
            <button class="g-btn ghost" id="draw" hidden>Offer draw</button>
            <button class="g-btn ghost" id="resign">Resign</button>
          </div>
          <div class="react" id="reactBox" hidden>
            <div class="react-row" id="reactRow" aria-label="Quick reactions"></div>
          </div>
        </aside>
      </div>
    </main>

    <div class="g-overlay" id="promo" role="dialog" aria-modal="true" aria-label="Choose a promotion piece">
      <div class="card">
        <h2>Promote to…</h2>
        <div class="promo-row" id="promoRow"></div>
      </div>
    </div>

    <div class="g-overlay" id="offer" role="dialog" aria-modal="true" aria-labelledby="offerTitle">
      <div class="card">
        <div class="big" id="offerEmoji" aria-hidden="true">🤝</div>
        <h2 id="offerTitle">Draw offered</h2>
        <p id="offerText">Your opponent offers a draw.</p>
        <div class="g-bar" style="justify-content:center">
          <button class="g-btn ghost" id="offerNo">Decline</button>
          <button class="g-btn" id="offerYes">Accept</button>
        </div>
      </div>
    </div>

    <div class="g-overlay" id="end" role="dialog" aria-modal="true" aria-labelledby="endTitle">
      <div class="card">
        <div class="big" id="endEmoji" aria-hidden="true">🏆</div>
        <h2 id="endTitle">Checkmate</h2>
        <p id="endText"></p>
        <div class="g-bar" style="justify-content:center">
          <button class="g-btn ghost" id="review">Review board</button>
          <button class="g-btn" id="again">New game</button>
        </div>
      </div>
    </div>

    <script src="../../assets/sound.js"></script>
    <script src="../../assets/back-link.js"></script>
    <script type="module" src="game.js"></script>
  </body>
</html>
