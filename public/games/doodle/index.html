<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Doodle &amp; Color · Zone 210</title>
    <meta name="theme-color" content="#eef0f5" />
    <script src="../../assets/theme.js"></script>
    <script src="../../assets/saver.js"></script>
    <link rel="stylesheet" href="../../assets/shell.css" />
    <link rel="stylesheet" href="style.css" />
      <meta name="description" content="Draw with a rainbow brush, stamp stickers, and colour in 20 pages of animals, vehicles, scenes and patterns. Or turn your own picture into a colouring page. Save your art." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zone 210" />
    <meta property="og:title" content="Doodle &amp; Color · Zone 210" />
    <meta property="og:description" content="Draw with a rainbow brush, stamp stickers, and colour in 20 pages of animals, vehicles, scenes and patterns. Or turn your own picture into a colouring page. Save your art." />
    <meta property="og:url" content="https://zone210.com/games/doodle/" />
    <meta property="og:image" content="https://zone210.com/assets/og/doodle.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Doodle &amp; Color on Zone 210" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Doodle &amp; Color · Zone 210" />
    <meta name="twitter:description" content="Draw with a rainbow brush, stamp stickers, and colour in 20 pages of animals, vehicles, scenes and patterns. Or turn your own picture into a colouring page. Save your art." />
    <meta name="twitter:image" content="https://zone210.com/assets/og/doodle.jpg" />
  </head>
  <body>
    <main class="g-page">
      <div class="g-head">
        <div>
          <h1>Doodle &amp; Color</h1>
          <p>Draw anything, or pick a colouring page and fill it with colour.</p>
        </div>
        <div class="g-bar">
          <button class="g-btn ghost" id="undo" aria-label="Undo">↶ Undo</button>
          <button class="g-btn ghost" id="redo" aria-label="Redo">↷ Redo</button>
          <button class="g-btn" id="savePhotos" hidden>📷 Save to Photos</button>
          <button class="g-btn" id="save">Save picture</button>
        </div>
      </div>

      <div class="pages" role="group" aria-label="Choose a colouring page">
        <div class="g-chips" id="cats" aria-label="Kinds of page"></div>
        <div class="g-chips" id="pages"></div>
        <p class="tip" id="saveNote" role="status" aria-live="polite" style="margin:6px 0 0"></p>
        <p class="tip" id="photoTip" hidden>Tip: your own drawings, cartoons and simple pictures turn into the best colouring pages. Busy photos give lots of tiny lines.</p>
        <input type="file" id="photo" accept="image/*" hidden />
      </div>

      <div class="stage" id="stage">
        <canvas id="paint" width="800" height="600" aria-label="Drawing canvas"></canvas>
        <canvas id="lines" width="800" height="600" aria-hidden="true"></canvas>
      </div>

      <section class="g-panel tools" aria-label="Tools">
        <div class="row" id="tools" role="group" aria-label="Tool"></div>
        <div class="row palette" id="palette" role="group" aria-label="Colours"></div>
        <div class="row">
          <span class="lbl">Size</span>
          <div class="g-chips" id="sizes" role="group" aria-label="Brush size">
            <button class="g-chip" data-value="6" aria-pressed="false">Small</button>
            <button class="g-chip" data-value="16" aria-pressed="true">Medium</button>
            <button class="g-chip" data-value="34" aria-pressed="false">Big</button>
          </div>
          <label class="custom">Custom colour <input type="color" id="custom" value="#e5484d" aria-label="Pick a custom colour" /></label>
          <button class="g-btn ghost" id="clear">🗑 Clear</button>
        </div>
        <div class="row stamps" id="stamps" role="group" aria-label="Stamps" hidden></div>
      </section>
    </main>

    <script src="../../assets/back-link.js"></script>
    <script type="module" src="game.js"></script>
  </body>
</html>
