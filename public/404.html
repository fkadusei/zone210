<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/assets/www.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found · Zone 210</title>
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0e1a" />
    <!-- Addresses start with / because this page is shown for any address that does not exist, however deep. -->
    <script src="/assets/theme.js"></script>
    <link rel="stylesheet" href="/assets/shell.css" />
    <style>
      .lost { min-height: 70vh; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; }
      .lost .big { font-size: clamp(64px, 18vw, 120px); line-height: 1; }
      .lost a.g-btn { text-decoration: none; display: inline-flex; align-items: center; }
      .lost p { max-width: 34ch; margin: 0; color: var(--muted); font-size: 1.1rem; }
    </style>
  </head>
  <body>
    <main class="g-page lost">
      <div class="big" aria-hidden="true">🧭</div>
      <h1>We can't find that page</h1>
      <p>It may have moved, or the address may have a small mistake in it. All the games are on the home page.</p>
      <a class="g-btn" href="/">← Go to the games</a>
    </main>
  </body>
</html>
